<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoTube 视频库</title>
    <script>
        // 主题引导：在样式生效前应用已保存的主题，避免闪烁（默认夜幕玻璃）
        (function () {
            var theme = 'dark';
            try { theme = localStorage.getItem('gotube_admin_theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="icon" href="/static/home/favicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="/static/admin/css/admin.css?v={{ASSET_VERSION}}">
    <script>
        window.GOTUBE_HIDDEN_PATH = "{{HIDDEN_PATH}}";
    </script>
</head>
<body>
    <div id="admin-shell" class="admin-shell">
        <header class="admin-topbar">
            <div class="admin-topbar-inner">
                <a href="#" id="admin-home-link" class="admin-brand" title="返回下载页">GoTube Admin</a>
                <div class="admin-topbar-side">
                    <button type="button" id="admin-theme-toggle" class="admin-theme-btn" aria-label="切换明暗主题"><span id="admin-theme-icon">☾</span></button>
                    <div id="admin-user-brief" class="admin-user-brief"></div>
                </div>
            </div>
            <nav class="admin-topnav" aria-label="后台导航">
                <button type="button" class="admin-topnav-btn" data-admin-nav="overview">概览</button>
                <button type="button" class="admin-topnav-btn" data-admin-nav="media">全局媒体</button>
                <button type="button" class="admin-topnav-btn" data-admin-nav="users">用户</button>
                <button type="button" class="admin-topnav-btn" data-admin-nav="invites">邀请码</button>
                <button type="button" class="admin-topnav-btn" data-admin-nav="system">系统</button>
            </nav>
        </header>

        <main id="admin-main" class="admin-main">
            <section id="overview-view-container" class="admin-view" data-admin-view="overview"></section>

            <section id="video-view-container" class="admin-view" data-admin-view="media" hidden>
                <div id="stats-slot"></div>
                <div id="filters-slot"></div>
                <div id="count-slot" class="count-container"></div>
                <div id="grid-slot"></div>
                <div id="pagination-slot"></div>
            </section>

            <section id="user-view-container" class="admin-view" data-admin-view="users" hidden>
                <div id="users-table-slot"></div>
            </section>

            <section id="invite-view-container" class="admin-view" data-admin-view="invites" hidden>
                <div id="invites-table-slot"></div>
            </section>

            <section id="system-view-container" class="admin-view" data-admin-view="system" hidden></section>
        </main>
    </div>

    <!-- 播放模态框 -->
    <div id="player-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="player-modal-title"></div>
                <button class="modal-close" id="player-modal-close" type="button">×</button>
            </div>
            <div class="modal-body" id="player-modal-body"></div>
        </div>
    </div>

    <!-- 前端统一为 ES Module：入口先加载全局兼容层，再按序加载各业务模块 -->
    <script type="module" src="/static/admin/js/main.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
