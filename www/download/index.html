<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoTube - 下载</title>
    <link rel="icon" href="/static/home/favicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="/static/download/page.css?v={{ASSET_VERSION}}">
</head>
<body>
    <div class="container">
        <div class="logo">🎬 <a href="#" id="logo-link" title="点击登录">GoTube</a></div>
        <div id="session-bar" class="session-bar">
            <span id="session-user"></span>
            <div class="session-actions">
                <button id="profile-btn" type="button" class="task-btn secondary" hidden>&#20462;&#25913;&#26165;&#31216;</button>
                <button id="password-btn" type="button" class="task-btn secondary" hidden>&#20462;&#25913;&#23494;&#30721;</button>
                <button id="admin-link-btn" type="button" class="task-btn secondary" hidden>管理后台</button>
                <button id="logout-btn" type="button" class="task-btn danger">退出登录</button>
            </div>
        </div>
        <form id="download-form" class="input-row" autocomplete="off">
            <input
                type="text"
                id="url-input"
                name="download_url"
                placeholder="粘贴视频链接，回车下载"
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                inputmode="url">
            <button id="dl-btn" type="button">下载</button>
        </form>
        <div id="status"></div>
        <div id="actionable-error" class="actionable-error" role="alert" aria-live="polite">
            <div id="actionable-error-message" class="actionable-error-message"></div>
            <div id="actionable-error-actions" class="actionable-error-actions"></div>
        </div>
        <div id="task-list"></div>
        <section id="library-section" class="library-section" hidden>
            <div class="library-header">
                <div>
                    <h2>我的视频库</h2>
                    <div id="quota-info" class="quota-info"></div>
                </div>
                <button id="refresh-library-btn" type="button" class="task-btn">刷新</button>
            </div>
            <div id="library-list"></div>
        </section>
    </div>

    <!-- 播放模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button id="modal-close-btn" class="modal-close" type="button">✕</button>
            </div>
            <div class="modal-body" id="modal-video"></div>
            <div class="modal-footer">
                <button class="modal-btn share" id="copy-btn" type="button">📋 复制链接</button>
            </div>
        </div>
    </div>

    <!-- 登录模态框 -->
    <div id="login-modal" class="modal">
        <div class="modal-content auth-modal">
            <div class="modal-header">
                <h3 id="auth-modal-title">登录</h3>
                <button id="login-modal-close-btn" class="modal-close" type="button">✕</button>
            </div>
            <div class="modal-body auth-body">
                <div class="auth-tabs">
                    <button id="show-login-btn" class="auth-tab active" type="button">登录</button>
                    <button id="show-register-btn" class="auth-tab" type="button">注册</button>
                </div>
                <form id="login-panel" autocomplete="on">
                    <div class="auth-field">
                        <input class="auth-input" type="text" id="login-username" name="username" placeholder="用户名" autocomplete="username">
                    </div>
                    <div class="auth-field">
                        <input class="auth-input" type="password" id="login-password" name="password" placeholder="密码" autocomplete="current-password">
                    </div>
                    <div id="login-error" class="auth-error"></div>
                    <div id="login-error-actions" class="auth-error-actions"></div>
                    <button id="login-submit-btn" type="button" class="auth-submit login">登录</button>
                </form>
                <form id="register-panel" hidden autocomplete="off">
                    <div class="auth-field">
                        <input class="auth-input" type="text" id="register-username" name="register_username" placeholder="用户名，3-32 位字母/数字/_/-" autocomplete="username">
                    </div>
                    <div class="auth-field">
                        <input class="auth-input" type="text" id="register-display-name" name="display_name" placeholder="&#26165;&#31216;" autocomplete="nickname">
                    </div>
                    <div class="auth-field">
                        <input class="auth-input" type="password" id="register-password" name="new_password" placeholder="密码，至少 6 位" autocomplete="new-password">
                    </div>
                    <div class="auth-field">
                        <input class="auth-input" type="text" id="register-invite" name="invite_code" placeholder="邀请码" autocomplete="off">
                    </div>
                    <div id="register-error" class="auth-error"></div>
                    <button id="register-submit-btn" type="button" class="auth-submit register">注册</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="/static/download/page.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
