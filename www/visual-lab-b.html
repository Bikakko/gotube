<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Lab B</title>
    <link rel="icon" href="/static/favicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="/static/visual-lab.css?v=4.2.0">
</head>
<body data-visual-theme="b">
    <canvas class="lab-sky" id="lab-sky" aria-hidden="true"></canvas>
    <div class="lab-clouds" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
    </div>
    <div class="lab-stars" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span>
    </div>
    <div class="lab-moon" aria-hidden="true"></div>
    <main class="lab-shell">
        <header class="lab-topbar">
            <a class="lab-back" href="/">返回</a>
            <div class="lab-tag">B / 月光玻璃型</div>
        </header>
        <section class="lab-hero">
            <div class="lab-copy">
                <h1>Visual Lab B</h1>
                <p>更克制、更统一、更像月光玻璃。</p>
            </div>
        </section>
        <section class="lab-grid" id="lab-grid"></section>
    </main>

    <div class="lab-modal" id="lab-modal" hidden>
        <div class="lab-modal-backdrop" data-close></div>
        <div class="lab-modal-panel" role="dialog" aria-modal="true">
            <button class="lab-close" id="lab-close" type="button" aria-label="Close">&times;</button>
            <div class="lab-modal-stage">
                <img id="lab-modal-image" class="lab-modal-image" alt="">
            </div>
        </div>
    </div>

    <script src="/static/visual-lab.js?v=4.2.0"></script>
</body>
</html>
