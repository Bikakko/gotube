<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moments</title>
    <link rel="icon" href="/static/favicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="/static/index.css?v=4.2.0">
</head>
<body>
    <div class="page-shimmer page-shimmer-a" aria-hidden="true"></div>
    <div class="page-shimmer page-shimmer-b" aria-hidden="true"></div>
    <div class="page-stars" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <main id="gallery-app" class="gallery-app">
        <header class="hero">
            <a id="secret-entry" class="secret-entry" href="#" aria-label="Open hidden entry">
                <img
                    id="secret-entry-image"
                    src="/static/secret-entry-placeholder.gif"
                    data-fallback-src="/static/favicon.jpg"
                    alt=""
                >
            </a>
        </header>

        <section class="albums-section" aria-labelledby="albums-title">
            <h2 id="albums-title" class="sr-only">Gallery</h2>
            <p id="albums-meta" class="sr-only">Loading albums...</p>
            <div id="albums-grid" class="albums-grid"></div>
            <div id="albums-empty" class="albums-empty" hidden>No public images yet.</div>
        </section>
    </main>

    <div id="gallery-modal" class="gallery-modal" hidden>
        <div class="gallery-modal-backdrop" data-modal-close></div>
        <div class="gallery-modal-panel" role="dialog" aria-modal="true" aria-label="Image viewer">
            <button type="button" class="modal-close" id="gallery-modal-close" aria-label="Close">×</button>
            <div class="modal-top">
                <div id="gallery-modal-count" class="gallery-modal-count">0 / 0</div>
            </div>
            <div class="modal-stage">
                <button type="button" class="modal-nav prev" id="gallery-prev" aria-label="Previous image">‹</button>
                <div class="modal-image-shell">
                    <img id="gallery-modal-image" class="modal-image" alt="">
                </div>
                <button type="button" class="modal-nav next" id="gallery-next" aria-label="Next image">›</button>
            </div>
        </div>
    </div>

    <script>
        window.GOTUBE_HIDDEN_PATH = "{{HIDDEN_PATH}}";
    </script>
    <script src="/static/index.js?v=4.2.0"></script>
</body>
</html>
