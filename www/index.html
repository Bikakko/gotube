<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoTube</title>
    <link rel="icon" href="/static/favicon.jpg" type="image/jpeg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }
        .home {
            width: 100%;
            max-width: 640px;
            text-align: center;
        }
        .logo {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .intro {
            color: #8b949e;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 132px;
            padding: 11px 18px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #161b22;
            color: #e6edf3;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }
        .action.primary {
            border-color: #e62117;
            background: #e62117;
            color: #fff;
            font-weight: 600;
        }
        .action:hover { border-color: #58a6ff; }
        .action.primary:hover { background: #ff3325; border-color: #ff3325; }
    </style>
</head>
<body>
    <main class="home">
        <div class="logo">GoTube</div>
        <p class="intro">这里会放置公开内容。下载和个人视频库入口暂时保留在独立页面。</p>
        <div class="actions">
            <a id="download-link" class="action primary" href="#">进入下载页</a>
        </div>
    </main>
    <script>
        window.GOTUBE_HIDDEN_PATH = "{{HIDDEN_PATH}}";
        const hiddenPath = window.GOTUBE_HIDDEN_PATH || "7777";
        document.getElementById("download-link").href = `/${hiddenPath}`;
    </script>
</body>
</html>
