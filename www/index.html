<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoTube - 登录</title>
    <link rel="icon" href="/static/favicon.jpg" type="image/jpeg">
    <style>
        :root {
            --bg: #0f0f0f;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --text-dim: #aaaaaa;
            --primary: #3ea6ff;
            --primary-hover: #65b8ff;
            --danger: #ff4d4d;
            --border: #333333;
            --input-bg: #121212;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            text-align: left;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-dim);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px;
            background-color: var(--primary);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--border);
            cursor: not-allowed;
            color: var(--text-dim);
        }

        .error-msg {
            color: var(--danger);
            font-size: 14px;
            min-height: 20px;
            margin-top: -10px;
            display: none;
        }

        .welcome-page {
            display: none;
        }

        .welcome-msg {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .welcome-user {
            color: var(--primary);
            font-weight: bold;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--border);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🎬 GoTube</div>

        <!-- 登录表单 -->
        <div id="login-section">
            <div class="login-form">
                <div class="input-group">
                    <label class="input-label" for="username">用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
                </div>
                <div class="input-group">
                    <label class="input-label" for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
                </div>
                <div id="error-msg" class="error-msg"></div>
                <button id="login-btn" onclick="handleLogin()">登录</button>
            </div>
        </div>

        <!-- 登录后欢迎页面 -->
        <div id="welcome-section" class="welcome-page">
            <div class="welcome-msg">👋 欢迎回来, <span id="welcome-user" class="welcome-user"></span></div>
            <div class="actions">
                <button onclick="enterAdmin()">进入管理页面</button>
                <button class="btn-secondary" onclick="handleLogout()">退出登录</button>
            </div>
        </div>
    </div>

    <script>
        window.GOTUBE_HIDDEN_PATH = "{{HIDDEN_PATH}}";
    </script>
    <script src="/static/common.js"></script>
    <script>
        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            await checkLoginStatus();
        });

        // 监听回车键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.getElementById('login-section').style.display !== 'none') {
                handleLogin();
            }
        });

        /**
         * 检查登录状态
         */
        async function checkLoginStatus() {
            const token = localStorage.getItem('gotube_admin_token');
            if (!token) return;

            try {
                const data = await apiFetch('/auth/check');
                if (data.valid && data.user) {
                    showWelcome(data.user);
                }
            } catch (err) {
                console.error('Check auth failed:', err);
                localStorage.removeItem('gotube_admin_token');
            }
        }

        /**
         * 处理登录
         */
        async function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('error-msg');
            const btn = document.getElementById('login-btn');

            if (!user || !pass) {
                showError('请输入用户名和密码');
                return;
            }

            btn.disabled = true;
            btn.textContent = '登录中...';
            errorEl.style.display = 'none';

            try {
                const response = await fetch(`${getApiBase()}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass }),
                });

                if (!response.ok) {
                    const data = await response.json().catch(() => ({ detail: '登录失败' }));
                    throw new Error(data.detail || '用户名或密码错误');
                }

                const data = await response.json();
                localStorage.setItem('gotube_admin_token', data.token);
                showWelcome(data.user);
            } catch (err) {
                showError(err.message);
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            } finally {
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }

        /**
         * 显示欢迎界面
         */
        function showWelcome(user) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('welcome-section').style.display = 'block';
            document.getElementById('welcome-user').textContent = user.username;
        }

        /**
         * 显示错误信息
         */
        function showError(msg) {
            const errorEl = document.getElementById('error-msg');
            const container = document.querySelector('.login-container');
            
            errorEl.textContent = '⚠️ ' + msg;
            errorEl.style.display = 'block';
            
            container.classList.remove('shake');
            void container.offsetWidth; // 触发重绘以重新运行动画
            container.classList.add('shake');
        }

        /**
         * 进入管理页
         */
        function enterAdmin() {
            // 获取隐藏路径（从 API 路径推断）
            const apiBase = getApiBase(); // /7777/admin/api
            const adminPath = apiBase.replace('/api', ''); // /7777/admin
            window.location.href = adminPath;
        }

        /**
         * 退出登录
         */
        function handleLogout() {
            localStorage.removeItem('gotube_admin_token');
            window.location.reload();
        }
    </script>
</body>
</html>
