<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moments</title>
    <link rel="icon" href="/static/home/favicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="/static/home/page.css?v={{ASSET_VERSION}}">
</head>
<body>
    <div id="home-scene" class="home-scene" aria-hidden="true"></div>

    <main class="home-shell">
        <header class="home-hero">
            <a id="secret-entry" class="secret-entry" href="/go" aria-label="Open hidden entry">
                <img
                    id="secret-entry-image"
                    src="/static/home/secret-entry-placeholder.gif"
                    data-fallback-src="/static/home/favicon.jpg"
                    alt=""
                >
            </a>
        </header>

        <section class="home-preview" aria-label="Navigation Cards">
            <div id="cards-grid" class="home-grid"></div>
            <div id="cards-empty" class="home-empty" hidden>No cards yet.</div>
        </section>
    </main>

    <script type="module" src="/static/home/page.js?v={{ASSET_VERSION}}"></script>

</html>
