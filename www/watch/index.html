<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">GoTube</title>
    <link rel="icon" href="/static/home/favicon.jpg" type="image/jpeg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 16px;
        }
        .container { width: 100%; max-width: 960px; }
        .player-wrap {
            width: 100%; background: #000; border-radius: 12px;
            overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        .player-wrap video {
            width: auto; height: auto; max-width: 100%; max-height: 70vh;
            display: block; margin: 0 auto; outline: none; /* 去掉键盘操作后的焦点框 */
        }
        .info { padding: 20px 0; }
        .info h1 { font-size: 18px; margin-bottom: 10px; word-break: break-word; }
        .meta { color: #8b949e; font-size: 14px; display: flex; gap: 16px; margin-bottom: 16px; }
        .dl-btn {
            display: inline-flex; align-items: center; padding: 10px 24px;
            background: #238636; color: #fff; border: none; border-radius: 8px;
            font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .dl-btn:hover { background: #2ea043; }
        .err { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; }
        .err h2 { color: #f85149; margin-bottom: 8px; }
        .err p { color: #8b949e; }
    </style>
</head>
<body>
    <div class="container" id="app"><div class="err"><p>加载中...</p></div></div>
    <script type="module" src="/static/shared/globals.js?v={{ASSET_VERSION}}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const p = new URLSearchParams(location.search);
            const id = p.get('v') || p.get('id');
            const app = document.getElementById('app');
            if (!id) { app.innerHTML = '<div class="err"><h2>无效链接</h2><p>分享链接缺少视频参数</p></div>'; return; }
            try {
                let shareMode = true;
                let res = await fetch(`/api/share/${encodeURIComponent(id)}/info`);
                if (!res.ok) {
                    shareMode = false;
                    res = await fetch(`/api/video/${encodeURIComponent(id)}/info`);
                }
                if (!res.ok) throw new Error('视频不存在');
                const v = await res.json();
                document.title = (v.title || 'GoTube') + ' - 视频播放';
                const url = `/watch?v=${encodeURIComponent(id)}`;
                const downloadUrl = shareMode ? `/api/share/${encodeURIComponent(id)}/download` : url;
                const sizes = ['B','KB','MB','GB'];
                const sz = v.size ? (() => { const i = Math.floor(Math.log(v.size)/Math.log(1024)); return (v.size/Math.pow(1024,i)).toFixed(1)+' '+sizes[i]; })() : '';
                app.innerHTML = `
                    <div class="player-wrap"><video id="p" controls autoplay loop><source src="${url}" type="video/mp4"></video></div>
                    <div class="info">
                        <h1>${esc(v.title||'未知标题')}</h1>
                        <div class="meta">${sz ? `<span>📦 ${sz}</span>` : ''}</div>
                        <button class="dl-btn" id="d">⬇ 下载视频</button>
                    </div>`;
                const video = document.getElementById('p');
                if (window.GoTube && typeof window.GoTube.attachVideoKeyboardControls === 'function') {
                    window.GoTube.attachVideoKeyboardControls(video, {
                        wheelTarget: document.querySelector('.player-wrap') || video,
                        feedbackTarget: document.querySelector('.player-wrap') || video.parentElement || video,
                    });
                }
                document.getElementById('d').onclick = () => {
                    const a = document.createElement('a'); a.href = downloadUrl; a.download = `${v.title || 'video'}.mp4`;
                    a.style.display='none'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
                };
            } catch(e) {
                app.innerHTML = `<div class="err"><h2>加载失败</h2><p>${esc(e.message)}</p></div>`;
            }
        });
        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    </script>
</body>
</html>
